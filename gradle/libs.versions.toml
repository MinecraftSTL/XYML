[versions]
jetbrains-annotations = "26.1.0"
kala-compress = "1.27.1-3"
kala-encoding-detctor = "0.1.0"
gson = "2.14.0"
tomlj = "1.1.1"
xz = "1.12"
lz4 = "1.10.4.1"
