name: Native Packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-packages.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'lib/**'
      - 'XYML/**'
      - 'XYMLBoot/**'
      - 'XYMLCore/**'
  pull_request:
    paths:
      - '.github/workflows/native-packages.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'lib/**'
      - 'XYML/**'
      - 'XYMLBoot/**'
      - 'XYMLCore/**'

jobs:
  package:
    name: ${{ matrix.platform }} native package
    runs-on: ${{ matrix.os }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            installer: exe
          - platform: macos
            os: macos-latest
            installer: dmg
          - platform: linux
            os: ubuntu-latest
            installer: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($wix) {
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Linux installer tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Build and verify dependency-complete JAR
        shell: bash
        run: ./gradlew :XYML:shadowJar :XYML:verifyOfflineUiArtifact --no-daemon --stacktrace

      - name: Build native application and installer offline
        shell: bash
        run: >-
          ./gradlew
          :XYML:jpackageAppImage
          :XYML:verifyPackagedRuntime
          :XYML:jpackageInstaller
          --offline
          --no-daemon
          --stacktrace
          -Pxyml.package.type=${{ matrix.installer }}

      - name: Archive app-image
        shell: bash
        run: >-
          tar
          -C XYML/build/jpackage/app-image
          -czf XYML/build/jpackage/XYML-${{ matrix.platform }}-${{ runner.arch }}-app-image.tar.gz
          .

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: XYML-${{ matrix.platform }}-${{ runner.arch }}-native
          path: |
            XYML/build/jpackage/XYML-${{ matrix.platform }}-${{ runner.arch }}-app-image.tar.gz
            XYML/build/jpackage/installer/*
          if-no-files-found: error
