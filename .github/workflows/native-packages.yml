name: Native Packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-packages.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'lib/**'
      - 'libraries/**'
      - 'XYML/**'
      - 'XYMLBoot/**'
      - 'XYMLCore/**'
  pull_request:
    paths:
      - '.github/workflows/native-packages.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'lib/**'
      - 'libraries/**'
      - 'XYML/**'
      - 'XYMLBoot/**'
      - 'XYMLCore/**'

jobs:
  package:
    name: ${{ matrix.platform }} native package
    runs-on: ${{ matrix.os }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=XYML_AGENT_JAVA_HOME
      RELEASE_CHANNEL: >-
        ${{ github.event_name == 'push' && github.ref_name == 'main' && 'stable'
        || github.event_name == 'push' && github.ref_name == 'beta' && 'beta'
        || github.event_name == 'push' && github.ref_name == 'alpha' && 'alpha'
        || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            installer: exe
          - platform: macos
            os: macos-latest
            installer: dmg
          - platform: linux
            os: ubuntu-latest
            installer: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up agent JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk

      - name: Register agent JDK 25 toolchain
        shell: bash
        run: echo "XYML_AGENT_JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Set up primary JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($wix) {
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify Windows C++20 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio Installer could not be found"
          }
          $buildTools = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $buildTools) {
            throw "Visual Studio 2022 C++ x86/x64 build tools are required"
          }
          $windowsSdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" `
            -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windowsSdk) {
            throw "A Windows SDK is required"
          }
          Write-Host "Using Visual Studio Build Tools: $buildTools"
          Write-Host "Using Windows SDK: $($windowsSdk.Name)"

      - name: Install Linux installer tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Build and verify dependency-complete JAR
        shell: bash
        run: ./gradlew :XYML:shadowJar :XYML:verifyOfflineUiArtifact --no-daemon --stacktrace

      - name: Build native application and installer offline
        shell: bash
        run: >-
          ./gradlew
          :XYML:jpackageAppImage
          :XYML:verifyPackagedRuntime
          :XYML:jpackageInstaller
          --offline
          --no-daemon
          --stacktrace
          -Pxyml.package.type=${{ matrix.installer }}

      - name: Archive app-image
        shell: bash
        run: >-
          tar
          -C XYML/build/jpackage/app-image
          -czf XYML/build/jpackage/XYML-${{ matrix.platform }}-${{ runner.arch }}-app-image.tar.gz
          .

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: XYML-${{ matrix.platform }}-${{ runner.arch }}-native
          path: |
            XYML/build/jpackage/XYML-${{ matrix.platform }}-${{ runner.arch }}-app-image.tar.gz
            XYML/build/jpackage/installer/*
          if-no-files-found: error
