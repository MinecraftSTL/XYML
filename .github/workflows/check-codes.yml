name: Check Codes

on:
  push:
    paths:
      - '**.java'
      - '**.properties'
  pull_request:
    paths:
      - '**.java'
      - '**.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=XYML_AGENT_JAVA_HOME
      RELEASE_CHANNEL: >-
        ${{ github.event_name == 'push' && github.ref_name == 'main' && 'stable'
        || github.event_name == 'push' && github.ref_name == 'beta' && 'beta'
        || github.event_name == 'push' && github.ref_name == 'alpha' && 'alpha'
        || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up agent JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: 'jdk'
      - name: Register agent JDK 25 toolchain
        shell: bash
        run: echo "XYML_AGENT_JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
      - name: Set up primary JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Check Codes
        run: ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace
