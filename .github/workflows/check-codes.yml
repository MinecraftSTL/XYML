name: Check Codes

on:
  push:
    paths:
      - '**.java'
      - '**.properties'
  pull_request:
    paths:
      - '**.java'
      - '**.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=XYML_AGENT_JAVA_HOME
      RELEASE_CHANNEL: >-
        ${{ github.event_name == 'push' && github.ref_name == 'main' && 'stable'
        || github.event_name == 'push' && github.ref_name == 'beta' && 'beta'
        || github.event_name == 'push' && github.ref_name == 'alpha' && 'alpha'
        || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up agent JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: 'jdk'
      - name: Register agent JDK 25 toolchain
        shell: bash
        run: echo "XYML_AGENT_JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
      - name: Set up primary JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Check Codes
        run: ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace
      - if: failure() && github.event_name == 'pull_request'
        name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0
      - if: failure() && github.event_name == 'pull_request'
        name: Generate Artifact
        run: |
          echo "${{ github.event.number }}" > PULL_REQUEST_NUMBER
          > ALL_REPORTS.jsonl
          find . -path "*/build/reports/checkstyle/*.xml" | while read -r xml_file; do
            if [ -s "$xml_file" ]; then
              echo "Processing $xml_file..."
              reviewdog -f=checkstyle -name="checkstyle" -reporter=rdjsonl < "$xml_file" >> ALL_REPORTS.jsonl
            else
              echo "Skipping empty or missing report: $xml_file"
            fi
          done
      - if: failure() && github.event_name == 'pull_request'
        name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-artifact
          path: |
            ALL_REPORTS.jsonl
            PULL_REQUEST_NUMBER
