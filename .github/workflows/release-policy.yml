name: Release Branch Policy

on:
  pull_request:
    branches:
      - main
      - beta
      - alpha
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - closed

permissions:
  contents: read

jobs:
  validate-flow:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Validate adjacent branch flow
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: >-
          bash ./config/release/validate-branch-flow.sh
          "$SOURCE_BRANCH"
          "$TARGET_BRANCH"
          "$BASE_COMMIT"
          "$SOURCE_COMMIT"

  audit-promotion-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          path: merged

      - name: Resolve merged base
        id: merge-parents
        env:
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        working-directory: merged
        run: echo "base_commit=$(git rev-parse "${MERGE_COMMIT}^1")" >> "$GITHUB_OUTPUT"

      - name: Checkout protected policy
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.merge-parents.outputs.base_commit }}
          path: policy

      - name: Audit release merge
        env:
          BASE_COMMIT: ${{ steps.merge-parents.outputs.base_commit }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        working-directory: merged
        run: >-
          bash ../policy/config/release/validate-branch-flow.sh
          "$SOURCE_BRANCH"
          "$TARGET_BRANCH"
          "$BASE_COMMIT"
          "$SOURCE_COMMIT"
          "$MERGE_COMMIT"
