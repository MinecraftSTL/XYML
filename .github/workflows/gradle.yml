name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=XYML_AGENT_JAVA_HOME
      RELEASE_CHANNEL: >-
        ${{ github.event_name == 'push' && github.ref_name == 'main' && 'stable'
        || github.event_name == 'push' && github.ref_name == 'beta' && 'beta'
        || github.event_name == 'push' && github.ref_name == 'alpha' && 'alpha'
        || 'dev' }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up agent JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '25'
        java-package: 'jdk'
    - name: Register agent JDK 25 toolchain
      shell: bash
      run: echo "XYML_AGENT_JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
    - name: Set up primary JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        java-package: 'jdk'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Build with Gradle
      run: >-
        xvfb-run --auto-servernum
        ./gradlew build -Pxyml.branchBuild.nested=true --no-daemon --parallel
      env:
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: XYML-${{ env.SHORT_SHA }}-jar
        path: XYML/build/libs/XYML-*.jar
        archive: false
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      with:
        name: XYML-${{ env.SHORT_SHA }}-exe
        path: XYML/build/libs/XYML-*.exe
        archive: false
    - name: Upload SH
      uses: actions/upload-artifact@v7
      with:
        name: XYML-${{ env.SHORT_SHA }}-sh
        path: XYML/build/libs/XYML-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: XYML-${{ env.SHORT_SHA }}-deb
        path: XYML/build/libs/XYML-*.deb
        archive: false
