name: Publish XYML Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Complete decimal Stable version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: stable
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate branch ownership
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != main ]]; then
            echo "Stable releases must run from main" >&2
            exit 1
          fi

      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            17
            25
          java-package: jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Prepare signing key
        shell: bash
        env:
          XYML_SIGNATURE_KEY_BASE64: ${{ secrets.XYML_SIGNATURE_KEY_BASE64 }}
        run: |
          if [[ -z "${XYML_SIGNATURE_KEY_BASE64}" ]]; then
            echo "XYML_SIGNATURE_KEY_BASE64 is required for public releases" >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/xyml-signing.key"
          printf '%s' "${XYML_SIGNATURE_KEY_BASE64}" | base64 --decode > "${key_file}"
          echo "XYML_SIGNATURE_KEY=${key_file}" >> "${GITHUB_ENV}"

      - name: Validate release metadata
        run: ./gradlew :XYML:validateReleaseMetadata --no-daemon --stacktrace

      - name: Build public artifacts
        run: ./gradlew :XYML:makeExecutables :XYML:makeDeb --no-daemon --stacktrace

      - name: Prepare release notes and channel descriptor
        shell: bash
        run: |
          jar="XYML/build/libs/XYML-${RELEASE_VERSION}.jar"
          if [[ ! -f "${jar}" || ! -f "${jar}.sha1" ]]; then
            echo "Expected release JAR or checksum is missing" >&2
            exit 1
          fi

          feedback="Feedback: https://github.com/MinecraftSTL/XYML/issues/new/choose"
          printf 'Channel: %s\n\n%s\n' "${RELEASE_CHANNEL}" "${feedback}" > release-notes.txt

          asset_url="https://github.com/MinecraftSTL/XYML/releases/download/v${RELEASE_VERSION}/XYML-${RELEASE_VERSION}.jar"
          jar_sha1="$(tr -d '\r\n' < "${jar}.sha1")"
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg jar "${asset_url}" \
            --arg jarsha1 "${jar_sha1}" \
            '{version: $version, jar: $jar, jarsha1: $jarsha1, force: false}' \
            > "xyml-update-${RELEASE_CHANNEL}.json"

      - name: Publish public GitHub release
        shell: bash
        run: |
          gh release create "v${RELEASE_VERSION}" \
            XYML/build/libs/XYML-${RELEASE_VERSION}.* \
            --target "${GITHUB_SHA}" \
            --title "XYML ${RELEASE_VERSION} (${RELEASE_CHANNEL})" \
            --notes-file release-notes.txt

      - name: Update channel descriptor
        shell: bash
        run: |
          if ! gh release view release-channels > /dev/null 2>&1; then
            gh release create release-channels \
              --target main \
              --title "XYML release channel metadata" \
              --notes "Machine-readable update descriptors for XYML release channels." \
              --prerelease
          fi
          gh release upload release-channels "xyml-update-${RELEASE_CHANNEL}.json" --clobber
