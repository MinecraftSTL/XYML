boot.unsupported_java_version=XYML 需要 Java 17 或更高版本才能运行，但依然支持使用 Java 6~16 启动游戏。请安装最新版本的 Java 再尝试启动 XYML。\n你可以继续保留旧版本 Java。XYML 能够识别与管理多个 Java，并会自动根据游戏版本为你选择合适的 Java。\n你可以访问 https://github.com/MinecraftSTL/XYML/issues/new/choose 页面寻求帮助。
boot.manual_update=XYML 在当前环境无法完成自动更新，请手动下载最新版本的 XYML。\n是否前往下载页面？

